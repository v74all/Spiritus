global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'v7lthronyx'

scrape_configs:
  - job_name: 'v7lthronyx-panel'
    static_configs:
      - targets: ['app:38471']
    metrics_path: '/api/system/metrics'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    scrape_interval: 10s
    scrape_timeout: 5s
    
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'alert_rules.yml'
