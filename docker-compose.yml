version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: spiritus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spiritus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spiritus}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spiritus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spiritus-net

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: spiritus-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spiritus-net

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spiritus-app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spiritus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spiritus}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      # Auth/session secrets. Empty values derive from SECRET_KEY at
      # startup; set them explicitly for key separation in production.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      ARGON2_SALT: ${ARGON2_SALT:-}
      # First-login admin. Cleared after first use — set in .env so the
      # operator can actually log in to a fresh deployment.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # REALITY keypair for VLESS REALITY protocols (generate: xray x25519).
      REALITY_PRIVATE_KEY: ${REALITY_PRIVATE_KEY:-}
      REALITY_PUBLIC_KEY: ${REALITY_PUBLIC_KEY:-}
      VPN_SERVER_IP: ${VPN_SERVER_IP:-}
      # CORS: leave empty to disable. "*" is rejected at startup, so we
      # must NOT default to it (that would crash the app).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:38471:38471"
      - "127.0.0.1:10085:10085"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - spiritus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38471/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: spiritus-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_bearer_token
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - spiritus-net

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:11.2.2
    container_name: spiritus-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ALLOW_EMBED_INITIATION: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - spiritus-net

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  spiritus-net:
    driver: bridge

secrets:
  metrics_bearer_token:
    environment: METRICS_BEARER_TOKEN
