apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spiritus.name" . }}
  labels:
    {{- include "spiritus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spiritus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "spiritus.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: spiritus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 38471
          envFrom:
            - configMapRef:
                name: {{ include "spiritus.name" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          startupProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/live, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
